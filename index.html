<img src="logo.webp" alt="Pi Radio" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">
    </div>

    <!--<h1>Pi Radio</h1>-->

    <button onclick="toggleRadio()">▶ Play</button>

    <audio id="radioPlayer"></audio>
  </div>

  <script>
    const player = document.getElementById('radioPlayer');
    const button = document.querySelector('button');
    const streamURL = "https://niobic-omari-boastingly.ngrok-free.dev/radio.mp3";

    let isPlaying = false;
    let retryDelay = 2000;
    const maxRetryDelay = 60000;
    let retryTimer = null;

    function clearRetry() {
      if (retryTimer !== null) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function resetRetry() {
      clearRetry();
      retryDelay = 2000;
    }

    function scheduleRetry() {
      if (!isPlaying || retryTimer !== null) return;
      const delay = retryDelay;
      retryDelay = Math.min(retryDelay * 2, maxRetryDelay);
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (isPlaying) startStream();
      }, delay);
    }

    function startStream() {
      clearRetry();
      player.src = streamURL + "?t=" + new Date().getTime(); // cache bust
      player.load();
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          retryDelay = 2000;
        }).catch(() => {
          if (isPlaying) scheduleRetry();
        });
      }
    }

    function toggleRadio() {
      if (!isPlaying) {
        resetRetry();
        isPlaying = true;
        startStream();
        button.textContent = "⏸ Pause";
      } else {
        isPlaying = false;
        resetRetry();
        player.pause();
        player.src = "";
        button.textContent = "▶ Play";
      }
    }

    player.addEventListener('playing', () => {
      retryDelay = 2000;
      clearRetry();
    });

    // ✅ AUTO-RECONNECT when stream ends
    player.addEventListener('ended', () => {
      if (isPlaying) {
        startStream();
      }
    });

    // ✅ AUTO-RECONNECT on error, with exponential backoff
    player.addEventListener('error', () => {
      if (isPlaying) {
        scheduleRetry();
      }
    });
  </script>
