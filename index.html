  <meta charset="UTF-8">

  <style>

<body>

  <div class="container">
    <div class="logo">
<img src="logo.webp" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">
    </div>

    <!--<h1>Pi Radio</h1>-->

    <button onclick="toggleRadio()">▶ Play</button>

    <audio id="radioPlayer"></audio>
  </div>

  <script>
    const player = document.getElementById('radioPlayer');
    const button = document.querySelector('button');
    const streamURL = "https://niobic-omari-boastingly.ngrok-free.dev/radio.mp3";

    let isPlaying = false;

    function startStream() {
      player.src = streamURL + "?t=" + new Date().getTime(); // cache bust
      player.load();
      player.play();
    }

    function toggleRadio() {
      if (!isPlaying) {
        startStream();
        button.textContent = "⏸ Pause";
        isPlaying = true;
      } else {
        player.pause();
        player.src = "";
        button.textContent = "▶ Play";
        isPlaying = false;
      }
    }

    // ✅ AUTO-RECONNECT when stream ends
    player.addEventListener('ended', () => {
      if (isPlaying) {
        startStream();
      }
    });

    // ✅ AUTO-RECONNECT on error (very important for live streams)
    player.addEventListener('error', () => {
      if (isPlaying) {
        setTimeout(startStream, 2000); // retry after 2 sec
      }
    });
  </script>
