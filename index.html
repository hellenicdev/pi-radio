  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px 16px 48px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 300px;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* ✅ RECTANGLE LOGO */
    .logo {
      width: 250px;
      height: 100px;
      margin: 0 auto 20px;
      background: #ccc;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      background: #ff4757;
      border: none;
      color: white;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      min-width: 140px;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:hover { background: #e8414f; }
    button:active { transform: scale(0.97); }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }
    .status {
      margin: 14px 0 0;
      font-size: 14px;
      color: #d0d0e0;
      min-height: 1.2em;
    }
    .status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #888;
      vertical-align: middle;
    }
    .status[data-state="live"]::before { background: #2ed573; }
    .status[data-state="connecting"]::before { background: #ffa502; }
    .status[data-state="error"]::before { background: #ff4757; }
    .volume {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 14px;
    }
    .volume input { width: 160px; accent-color: #ff4757; }
    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

 <style>.site-logo {

<body>

<a href="/">
  <img src="https://hellenicdev.eu/logo.webp" alt="HellenicDev home" class="site-logo">
</a>

  <div class="container">
    <div class="logo">
<img src="logo.webp" alt="Pi Radio" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">
    </div>

    <h1 class="visually-hidden">Pi Radio</h1>
    <button type="button" id="playButton" onclick="toggleRadio()" aria-pressed="false">▶ Play</button>
    <p class="status" id="status" role="status" aria-live="polite" data-state="idle">Off air: press play</p>
    <div class="volume">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </div>
    <audio id="radioPlayer" preload="none"></audio>
  </div>

  <script>
    const player = document.getElementById('radioPlayer');
    const button = document.getElementById('playButton');
    const statusEl = document.getElementById('status');
    const volumeEl = document.getElementById('volume');

    function setStatus(state, text) {
      statusEl.dataset.state = state;
      statusEl.textContent = text;
    }

    try {
      const savedVolume = parseFloat(localStorage.getItem('pi-radio-volume'));
      if (!Number.isNaN(savedVolume)) volumeEl.value = savedVolume;
    } catch (_) { /* storage unavailable */ }
    player.volume = parseFloat(volumeEl.value);
    volumeEl.addEventListener('input', () => {
      player.volume = parseFloat(volumeEl.value);
      try { localStorage.setItem('pi-radio-volume', volumeEl.value); } catch (_) { /* ignore */ }
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Pi Radio',
        artist: 'HellenicDev',
        artwork: [{ src: 'logo.webp', type: 'image/webp' }]
      });
      navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) toggleRadio(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) toggleRadio(); });
    }
    const streamURL = "https://niobic-omari-boastingly.ngrok-free.dev/radio.mp3";

    let isPlaying = false;
    let retryDelay = 2000;
    const maxRetryDelay = 60000;
    let retryTimer = null;

    function clearRetry() {
      if (retryTimer !== null) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function resetRetry() {
      clearRetry();
      retryDelay = 2000;
    }

    function scheduleRetry() {
      if (!isPlaying || retryTimer !== null) return;
      const delay = retryDelay;
      setStatus('error', 'Stream unavailable, retrying in ' + Math.round(delay / 1000) + 's…');
      retryDelay = Math.min(retryDelay * 2, maxRetryDelay);
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (isPlaying) startStream();
      }, delay);
    }

    function startStream() {
      clearRetry();
      setStatus('connecting', 'Connecting…');
      player.src = streamURL + "?t=" + new Date().getTime(); // cache bust
      player.load();
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          retryDelay = 2000;
        }).catch(() => {
          if (isPlaying) scheduleRetry();
        });
      }
    }

    function toggleRadio() {
      if (!isPlaying) {
        resetRetry();
        isPlaying = true;
        startStream();
        button.textContent = "⏸ Pause";
        button.setAttribute('aria-pressed', 'true');
      } else {
        isPlaying = false;
        resetRetry();
        player.pause();
        // Removing the source (rather than setting it to "") stops the download
        // without the browser trying to load the page URL as audio.
        player.removeAttribute('src');
        player.load();
        button.textContent = "▶ Play";
        button.setAttribute('aria-pressed', 'false');
        setStatus('idle', 'Off air: press play');
      }
    }

    player.addEventListener('playing', () => {
      setStatus('live', 'Live');
      retryDelay = 2000;
      clearRetry();
    });

    // ✅ AUTO-RECONNECT when stream ends
    player.addEventListener('ended', () => {
      if (isPlaying) {
        startStream();
      }
    });

    // ✅ AUTO-RECONNECT on error, with exponential backoff
    player.addEventListener('error', () => {
      if (isPlaying) {
        scheduleRetry();
      }
    });
  </script>
